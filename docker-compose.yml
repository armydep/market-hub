services:
  postgres:
    image: postgres:16-alpine
    container_name: market-hub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-markethub}
      POSTGRES_USER: ${DB_USERNAME:-markethub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-markethub}
    ports:
      - "5432:5432"
    volumes:
      - market-hub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${DB_USERNAME:-markethub} -d ${DB_NAME:-markethub}"
      ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  market-hub-pgdata:
