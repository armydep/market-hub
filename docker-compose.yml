services:
  postgres:
    image: postgres:16-alpine
    container_name: market-hub-postgres
    environment:
      POSTGRES_DB: markethub
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: markethub
    ports:
      - "5432:5432"
    volumes:
      - market-hub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markethub -d markethub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  market-hub-pgdata:
