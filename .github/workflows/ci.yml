name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the checkout. Without this block the
# workflow inherits whatever the repository default is, which may be write.
permissions:
  contents: read

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # GitHub-hosted runners ship a working Docker daemon and unrestricted
      # registry access, so Testcontainers needs no mirror configuration here.
      # (Locally, this repo's sandbox reaches Docker Hub only via mirror.gcr.io.)
      - name: Run tests
        run: ./mvnw -B test

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Type errors only surface here: `vitest run` transpiles without
      # type-checking, so the build is what actually runs tsc.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
