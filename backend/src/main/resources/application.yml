spring:
  application:
    name: market-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/markethub}
    username: ${DB_USERNAME:markethub}
    password: ${DB_PASSWORD:markethub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  coinmarketcap:
    api-key: ${CMC_API_KEY:}
    base-url: ${CMC_BASE_URL:https://pro-api.coinmarketcap.com}
    convert: ${CMC_CONVERT:USD}
  poller:
    enabled: ${POLLER_ENABLED:true}
    coin-limit: ${POLLER_COIN_LIMIT:100}
    interval-ms: ${POLLER_INTERVAL_MS:180000}
    initial-delay-ms: ${POLLER_INITIAL_DELAY_MS:5000}

logging:
  level:
    com.am.market_hub: INFO
