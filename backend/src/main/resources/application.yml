spring:
  application:
    name: market-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/markethub}
    username: ${DB_USERNAME:markethub}
    password: ${DB_PASSWORD:markethub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.am.market_hub: INFO
