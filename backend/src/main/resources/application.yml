spring:
  application:
    name: market-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/markethub}
    username: ${DB_USERNAME:markethub}
    password: ${DB_PASSWORD:markethub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  coinmarketcap:
    api-key: ${CMC_API_KEY:}
    base-url: ${CMC_BASE_URL:https://pro-api.coinmarketcap.com}
    convert: ${CMC_CONVERT:USD}
  poller:
    enabled: ${POLLER_ENABLED:true}
    coin-limit: ${POLLER_COIN_LIMIT:100}
    interval-ms: ${POLLER_INTERVAL_MS:180000}
    initial-delay-ms: ${POLLER_INITIAL_DELAY_MS:5000}
  market:
    # PRD 7.3 requires these to be configuration rather than constants.
    # Validated against the CoinColumn catalog at startup.
    # NOTE: the two list values must stay comma-delimited strings — they bind via
    # @Value, so YAML block-sequence syntax (- 20) would leave the placeholder
    # unresolved and fail startup with a misleading "could not resolve" message.
    default-page-size: ${MARKET_DEFAULT_PAGE_SIZE:20}
    supported-page-sizes: ${MARKET_SUPPORTED_PAGE_SIZES:20,50,100}
    default-visible-columns: ${MARKET_DEFAULT_VISIBLE_COLUMNS:marketCapRank,name,symbol,price,pctChange1h,pctChange24h,pctChange7d,marketCap,volume24h,circulatingSupply}
  jwt:
    # Dev-only fallback so the app boots with no .env; never used in a real deployment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32-bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    # Empty by default: the startup seed skips gracefully with no admin configured
    # (e.g. in tests), mirroring how a missing CMC_API_KEY degrades rather than crashes.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  auth:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    # Minutes, not ms — human-friendly to configure. Bound as a double so tests
    # can override it to a sub-minute fraction for a fast expiry check.
    lockout-duration-minutes: ${AUTH_LOCKOUT_DURATION_MINUTES:15}
    password-reset-token-lifetime-minutes: ${PASSWORD_RESET_TOKEN_LIFETIME_MINUTES:60}

logging:
  level:
    com.am.market_hub: ${APP_LOG_LEVEL:INFO}
